<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Дашборд — Оптимизация процессов</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    /* ===== БАЗА ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-size: 13px;
      line-height: 1.5;
      background: #F7F8FA;
      color: #1F2937;
      padding: 24px;
    }
    @media (max-width: 600px) { body { padding: 12px; } }

    /* ===== ШАПКА ===== */
    .header { margin-bottom: 24px; }
    .header h1 { font-size: 18px; font-weight: 600; color: #1F2937; }
    .header .subtitle { font-size: 12px; color: #6B7280; margin-top: 2px; }

    /* ===== ПАНЕЛЬ ФИЛЬТРОВ И ЭКСПОРТА ===== */
    .toolbar {
      display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
      background: #FFFFFF; border: 1px solid #E5E7EB; border-radius: 10px;
      padding: 12px 20px; margin-bottom: 24px; box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }
    .toolbar input[type="text"], .toolbar select {
      font-size: 12px; padding: 6px 10px; border: 1px solid #E5E7EB;
      border-radius: 6px; background: #fff; color: #1F2937; outline: none;
    }
    .toolbar input[type="text"]:focus, .toolbar select:focus { border-color: #4B6A88; }
    .toolbar .spacer { flex: 1; }
    .toolbar button {
      padding: 6px 12px; font-size: 12px; font-weight: 500; border-radius: 6px;
      cursor: pointer; border: 1px solid #E5E7EB; background: #fff; color: #1F2937;
    }
    .toolbar button:hover { background: #F3F4F6; }
    .toolbar button.primary { background: #4B6A88; color: #fff; border-color: #4B6A88; }
    .toolbar button.primary:hover { background: #3d5a73; }

    /* ===== KPI ===== */
    .kpi-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 14px; margin-bottom: 24px;
    }
    .kpi-card {
      background: #FFFFFF; border: 1px solid #E5E7EB; border-radius: 10px;
      padding: 18px 20px; box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }
    .kpi-card .label { font-size: 11px; font-weight: 500; text-transform: uppercase; color: #6B7280; margin-bottom: 6px; }
    .kpi-card .value { font-size: 28px; font-weight: 700; color: #1F2937; }
    .kpi-card .value.accent-blue { color: #4B6A88; }
    .kpi-card .value.accent-green { color: #A3B18A; }
    .kpi-card .value.accent-rose { color: #C9ADA7; }

    /* ===== СЕТКА ГРАФИКОВ ===== */
    .charts-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px;
    }
    @media (max-width: 768px) { .charts-grid { grid-template-columns: 1fr; } }
    .chart-card {
      background: #FFFFFF; border: 1px solid #E5E7EB; border-radius: 10px;
      padding: 20px; box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }
    .chart-card h3 { font-size: 12px; font-weight: 500; text-transform: uppercase; color: #6B7280; margin-bottom: 14px; }
    .chart-wrap { position: relative; width: 100%; height: 250px; }

    /* ===== ТАЙМЛАЙН ПРОЕКТОВ ===== */
    .timeline-card {
      background: #FFFFFF; border: 1px solid #E5E7EB; border-radius: 10px;
      padding: 20px; box-shadow: 0 1px 2px rgba(0,0,0,0.04); margin-bottom: 24px;
    }
    .timeline-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; flex-wrap: wrap; gap: 10px; }
    .timeline-header h3 { font-size: 12px; font-weight: 500; text-transform: uppercase; color: #6B7280; }
    .role-tabs { display: flex; gap: 4px; background: #F3F4F6; padding: 4px; border-radius: 8px; }
    .role-tab { padding: 4px 12px; font-size: 11px; font-weight: 500; border-radius: 6px; cursor: pointer; color: #6B7280; border: none; background: transparent; }
    .role-tab.active { background: #fff; color: #1F2937; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
    
    .legend { display: flex; gap: 16px; font-size: 11px; color: #6B7280; margin-bottom: 14px; }
    .legend span { display: flex; align-items: center; gap: 4px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .dot-done { background: #A3B18A; }
    .dot-wip { background: #4B6A88; }
    .dot-pause { background: #C9ADA7; }

    .project-row {
      border: 1px solid #E5E7EB; border-radius: 8px; margin-bottom: 8px; overflow: hidden;
    }
    .project-summary {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px; cursor: pointer; background: #F9FAFB;
      transition: background 0.15s; user-select: none;
    }
    .project-summary:hover { background: #F3F4F6; }
    .project-summary .title { font-weight: 600; font-size: 13px; color: #1F2937; display: flex; align-items: center; gap: 8px;}
    .project-summary .meta-info { font-size: 11px; color: #6B7280; display: flex; gap: 12px; }
    .project-summary .arrow { color: #9CA3AF; transition: transform 0.2s; }
    .project-row.open .arrow { transform: rotate(90deg); }
    
    .project-details {
      display: none; padding: 16px; border-top: 1px solid #E5E7EB; background: #FFFFFF;
    }
    .project-row.open .project-details { display: block; }
    .info-line { font-size: 12px; color: #4B5563; margin-bottom: 6px; }
    .info-line strong { color: #1F2937; font-weight: 500; }
    
    .stages-container { margin-top: 16px; display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; }
    .stage-box { flex: 1; min-width: 140px; border: 1px solid #E5E7EB; border-radius: 6px; padding: 10px; background: #FAFBFC; }
    .stage-box.done { border-color: #A3B18A; background: #ECFDF5; }
    .stage-box.wip { border-color: #4B6A88; background: #EFF6FF; }
    .stage-box.pause { border-color: #C9ADA7; background: #FEF3C7; }
    .stage-box h4 { font-size: 11px; text-transform: uppercase; color: #6B7280; margin-bottom: 4px; }
    .stage-box p { font-size: 12px; font-weight: 500; }
    
    .quarters-list { margin-top: 8px; font-size: 11px; color: #4B5563; }
    .quarters-list div { margin-bottom: 2px; }
    .quarters-list strong { color: #1F2937; }

    /* ===== ТАБЛИЦА ===== */
    .table-card {
      background: #FFFFFF; border: 1px solid #E5E7EB; border-radius: 10px;
      padding: 20px; box-shadow: 0 1px 2px rgba(0,0,0,0.04); overflow-x: auto;
    }
    .table-card h3 { font-size: 12px; font-weight: 500; text-transform: uppercase; color: #6B7280; margin-bottom: 14px; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    thead th {
      text-align: left; padding: 10px 12px; border-bottom: 2px solid #E5E7EB;
      font-weight: 600; font-size: 11px; text-transform: uppercase; color: #6B7280;
    }
    tbody td { padding: 10px 12px; border-bottom: 1px solid #F3F4F6; white-space: nowrap; }
    tbody tr:hover { background: #F9FAFB; }
    
    .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 500; }
    .badge-done { background: #ECFDF5; color: #065F46; }
    .badge-wip { background: #EFF6FF; color: #1E40AF; }
    .badge-pause { background: #FEF3C7; color: #92400E; }

    .empty-state { padding: 40px; text-align: center; color: #9CA3AF; font-style: italic; }
  </style>
</head>
<body>

  <div class="header">
    <h1>Охват работы Процессного офиса</h1>
    <p class="subtitle">Дашборд проектов и оптимизации процессов</p>
  </div>

  <!-- ТУЛБАР -->
  <div class="toolbar">
    <input type="text" id="search-input" placeholder="Поиск по названию..." />
    <select id="status-filter">
      <option value="all">Все статусы</option>
      <option value="в работе">В работе</option>
      <option value="завершён">Завершён</option>
      <option value="на паузе">На паузе</option>
    </select>
    <label style="font-size: 12px; display: flex; align-items: center; gap: 4px; cursor: pointer;">
      <input type="checkbox" id="only-support" /> Только обеспечивающие
    </label>
    <button id="reset-btn">Сбросить</button>
    <div class="spacer"></div>
    <button id="export-csv" class="primary">Экспорт CSV</button>
    <button id="export-json">Экспорт JSON</button>
  </div>

  <!-- KPI -->
  <div class="kpi-grid" id="kpi-grid"></div>

  <!-- ГРАФИКИ -->
  <div class="charts-grid">
    <div class="chart-card">
      <h3>Статусы проектов</h3>
      <div class="chart-wrap"><canvas id="chart-status"></canvas></div>
    </div>
    <div class="chart-card">
      <h3>Направления</h3>
      <div class="chart-wrap"><canvas id="chart-direction"></canvas></div>
    </div>
    <div class="chart-card">
      <h3>Этапы (общая готовность)</h3>
      <div class="chart-wrap"><canvas id="chart-stages"></canvas></div>
    </div>
    <div class="chart-card">
      <h3>Теги (кампусы)</h3>
      <div class="chart-wrap"><canvas id="chart-tags"></canvas></div>
    </div>
  </div>

  <!-- ТАЙМЛАЙН -->
  <div class="timeline-card">
    <div class="timeline-header">
      <h3>Проекты (таймлайн)</h3>
      <div class="role-tabs" id="role-tabs">
        <button class="role-tab active" data-role="po">ПО</button>
        <button class="role-tab" data-role="owner">Владелец</button>
        <button class="role-tab" data-role="cb">ЦБ</button>
      </div>
    </div>
    <div class="legend">
      <span><span class="dot dot-done"></span> Завершено</span>
      <span><span class="dot dot-wip"></span> В работе</span>
      <span><span class="dot dot-pause"></span> На паузе / Ожидает</span>
    </div>
    <div id="timeline-list"></div>
  </div>

  <!-- ТАБЛИЦА -->
  <div class="table-card">
    <h3>Сводная таблица</h3>
    <table id="data-table">
      <thead>
        <tr>
          <th>Проект</th>
          <th>Направление</th>
          <th>Владелец</th>
          <th>Статус</th>
          <th>Даты</th>
          <th>Теги</th>
        </tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>

  <script>
    // ============================================================
    // СОСТОЯНИЕ
    // ============================================================
    let rawData = [];
    let charts = {};
    let currentRole = 'po'; // po, owner, cb
    let filters = { search: '', status: 'all', onlySupport: false };

    // ============================================================
    // УТИЛИТЫ
    // ============================================================
    function esc(s) {
      if (s == null) return '';
      return String(s).replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      }[c]));
    }

    function getStatusClass(status) {
      if (status === 'завершён') return 'done';
      if (status === 'в работе') return 'wip';
      if (status === 'на паузе' || status === 'ожидает') return 'pause';
      return '';
    }

    // ============================================================
    // ФИЛЬТРАЦИЯ
    // ============================================================
    function getFilteredData() {
      return rawData.filter(p => {
        // Роли (упрощенно: ПО видит все, Владелец видит свои, ЦБ видит все)
        // В реальности тут будет логика на основе массива доступов
        if (currentRole === 'owner' && p.owner !== 'Иванов И.И.') {
             // Тестовая логика: допустим, текущий пользователь - Иванов
             // return false; 
        }
        
        if (filters.search) {
          const q = filters.search.toLowerCase();
          if (!(p.name || '').toLowerCase().includes(q) && !(p.owner || '').toLowerCase().includes(q)) return false;
        }
        if (filters.status !== 'all' && p.status !== filters.status) return false;
        if (filters.onlySupport && p.direction !== 'обеспечивающий') return false;
        return true;
      });
    }

    // ============================================================
    // РЕНДЕР KPI
    // ============================================================
    function renderKPIs(data) {
      const grid = document.getElementById('kpi-grid');
      const total = data.length;
      const done = data.filter(p => p.status === 'завершён').length;
      const wip = data.filter(p => p.status === 'в работе').length;
      const support = data.filter(p => p.direction === 'обеспечивающий').length;

      grid.innerHTML = `
        <div class="kpi-card"><div class="label">Всего проектов</div><div class="value">${total}</div></div>
        <div class="kpi-card"><div class="label">Завершено</div><div class="value accent-green">${done}</div></div>
        <div class="kpi-card"><div class="label">В работе</div><div class="value accent-blue">${wip}</div></div>
        <div class="kpi-card"><div class="label">Обеспечивающих</div><div class="value accent-rose">${support}</div></div>
      `;
    }

    // ============================================================
    // РЕНДЕР ГРАФИКОВ
    // ============================================================
    function renderCharts(data) {
      Object.values(charts).forEach(c => c.destroy());
      charts = {};

      const commonOpts = { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } };

      // 1. Статусы
      const statusCounts = { 'завершён': 0, 'в работе': 0, 'на паузе': 0 };
      data.forEach(p => { if (statusCounts[p.status] !== undefined) statusCounts[p.status]++; });
      charts.status = new Chart(document.getElementById('chart-status'), {
        type: 'doughnut',
        data: {
          labels: ['Завершён', 'В работе', 'На паузе'],
          datasets: [{ data: [statusCounts['завершён'], statusCounts['в работе'], statusCounts['на паузе']], backgroundColor: ['#A3B18A', '#4B6A88', '#C9ADA7'], borderWidth: 0 }]
        },
        options: { ...commonOpts, cutout: '60%' }
      });

      // 2. Направления
      const dirCounts = {};
      data.forEach(p => { dirCounts[p.direction] = (dirCounts[p.direction] || 0) + 1; });
      charts.direction = new Chart(document.getElementById('chart-direction'), {
        type: 'bar',
        data: {
          labels: Object.keys(dirCounts),
          datasets: [{ label: 'Проектов', data: Object.values(dirCounts), backgroundColor: '#8FA8B8', borderRadius: 4 }]
        },
        options: { ...commonOpts, plugins: { legend: { display: false } }, scales: { x: { grid: { display: false } }, y: { beginAtZero: true, ticks: { stepSize: 1 } } } }
      });

      // 3. Этапы (готовность)
      const stages = ['analysis', 'current_state', 'target_state', 'decision', 'implementation'];
      const stageNames = ['Анализ', 'Текущее', 'Целевое', 'Решение', 'Внедрение'];
      const stageData = stages.map(s => data.filter(p => p.stages && p.stages[s] && p.stages[s].status === 'завершён').length);
      charts.stages = new Chart(document.getElementById('chart-stages'), {
        type: 'bar',
        data: {
          labels: stageNames,
          datasets: [{ label: 'Завершено', data: stageData, backgroundColor: '#A3B18A', borderRadius: 4 }]
        },
        options: { ...commonOpts, plugins: { legend: { display: false } }, scales: { x: { grid: { display: false } }, y: { beginAtZero: true, ticks: { stepSize: 1 } } } }
      });

      // 4. Теги (кампусы)
      const tagCounts = {};
      data.forEach(p => {
        (p.tags || []).forEach(t => {
          if (t.startsWith('кампус:')) {
            const val = t.split(':')[1];
            tagCounts[val] = (tagCounts[val] || 0) + 1;
          }
        });
      });
      charts.tags = new Chart(document.getElementById('chart-tags'), {
        type: 'bar',
        data: {
          labels: Object.keys(tagCounts),
          datasets: [{ label: 'Проектов', data: Object.values(tagCounts), backgroundColor: '#C9ADA7', borderRadius: 4 }]
        },
        options: { ...commonOpts, indexAxis: 'y', plugins: { legend: { display: false } }, scales: { x: { beginAtZero: true, ticks: { stepSize: 1 } }, y: { grid: { display: false } } } }
      });
    }

    // ============================================================
    // РЕНДЕР ТАЙМЛАЙНА
    // ============================================================
    function renderTimeline(data) {
      const list = document.getElementById('timeline-list');
      if (!data.length) {
        list.innerHTML = '<div class="empty-state">Нет проектов, подходящих под фильтры</div>';
        return;
      }

      list.innerHTML = data.map(p => {
        const statusCls = getStatusClass(p.status);
        const isOpen = false; // По умолчанию закрыто

        // Этапы
        const stagesHtml = p.stages ? Object.entries(p.stages).map(([key, st]) => {
          if (key === 'implementation') return ''; // Внедрение рендерим отдельно ниже
          const titles = { analysis: 'Анализ', current_state: 'Текущее', target_state: 'Целевое', decision: 'Решение' };
          const cls = getStatusClass(st.status);
          return `<div class="stage-box ${cls}"><h4>${titles[key] || key}</h4><p>${esc(st.status)}</p></div>`;
        }).join('') : '';

        // Кварталы внедрения
        let implHtml = '';
        if (p.stages && p.stages.implementation && p.stages.implementation.quarters) {
          const q = p.stages.implementation.quarters;
          const qKeys = Object.keys(q);
          if (qKeys.length) {
            implHtml = `<div class="quarters-list" style="margin-top:12px; border-top:1px dashed #E5E7EB; padding-top:8px;">
              <div style="font-weight:600; margin-bottom:4px; color:#1F2937;">Внедрение по кварталам:</div>
              ${qKeys.map(k => `<div><strong>${k}:</strong> ${esc(q[k].join(', '))}</div>`).join('')}
            </div>`;
          }
        }

        return `
          <div class="project-row" data-id="${p.id}">
            <div class="project-summary">
              <div class="title">
                <span class="dot dot-${statusCls === 'done' ? 'done' : statusCls === 'wip' ? 'wip' : 'pause'}"></span>
                ${esc(p.name)}
              </div>
              <div class="meta-info">
                <span>${esc(p.direction)}</span>
                <span>${esc(p.owner)}</span>
                <span>${esc(p.status)}</span>
                <span class="arrow">▶</span>
              </div>
            </div>
            <div class="project-details">
              <div class="info-line"><strong>Владелец:</strong> ${esc(p.owner)}</div>
              <div class="info-line"><strong>Участники:</strong> ${esc((p.participants || []).join(', '))}</div>
              <div class="info-line"><strong>Пользователи:</strong> ${esc((p.users || []).join(', '))}</div>
              <div class="info-line"><strong>Период:</strong> ${esc(p.start || '—')} — ${esc(p.end || '—')}</div>
              <div class="info-line"><strong>Теги:</strong> ${esc((p.tags || []).join(', '))}</div>
              
              <div class="stages-container">
                ${stagesHtml}
              </div>
              ${implHtml}
            </div>
          </div>
        `;
      }).join('');

      // Добавляем обработчики кликов на заголовки карточек
      list.querySelectorAll('.project-summary').forEach(summary => {
        summary.addEventListener('click', () => {
          const row = summary.closest('.project-row');
          row.classList.toggle('open');
        });
      });
    }

    // ============================================================
    // РЕНДЕР ТАБЛИЦЫ
    // ============================================================
    function renderTable(data) {
      const tbody = document.getElementById('table-body');
      if (!data.length) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:20px; color:#9CA3AF;">Нет данных</td></tr>';
        return;
      }
      
      tbody.innerHTML = data.map(p => {
        let badgeCls = p.status === 'завершён' ? 'badge-done' : p.status === 'в работе' ? 'badge-wip' : 'badge-pause';
        return `
          <tr>
            <td>${esc(p.name)}</td>
            <td>${esc(p.direction)}</td>
            <td>${esc(p.owner)}</td>
            <td><span class="badge ${badgeCls}">${esc(p.status)}</span></td>
            <td>${esc(p.start || '—')} — ${esc(p.end || '—')}</td>
            <td>${esc((p.tags || []).join(', '))}</td>
          </tr>
        `;
      }).join('');
    }

    // ============================================================
    // ГЛАВНЫЙ ЦИКЛ ОТРИСОВКИ
    // ============================================================
    function updateView() {
      const filtered = getFilteredData();
      renderKPIs(filtered);
      renderCharts(filtered);
      renderTimeline(filtered);
      renderTable(filtered);
    }

    // ============================================================
    // ЭКСПОРТ
    // ============================================================
    document.getElementById('export-csv').addEventListener('click', () => {
      const data = getFilteredData();
      if (!data.length) return alert('Нет данных для экспорта');
      
      const headers = ['ID', 'Название', 'Направление', 'Владелец', 'Статус', 'Начало', 'Окончание'];
      const rows = data.map(p => [p.id, p.name, p.direction, p.owner, p.status, p.start, p.end].map(v => `"${String(v||'').replace(/"/g, '""')}"`).join(';'));
      const csv = '\uFEFF' + [headers.join(';'), ...rows].join('\n');
      
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'projects_export.csv';
      a.click();
    });

    document.getElementById('export-json').addEventListener('click', () => {
      const data = getFilteredData();
      if (!data.length) return alert('Нет данных для экспорта');
      
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'projects_export.json';
      a.click();
    });

    // ============================================================
    // СОБЫТИЯ ФИЛЬТРОВ И РОЛЕЙ
    // ============================================================
    document.getElementById('search-input').addEventListener('input', e => {
      filters.search = e.target.value;
      updateView();
    });

    document.getElementById('status-filter').addEventListener('change', e => {
      filters.status = e.target.value;
      updateView();
    });

    document.getElementById('only-support').addEventListener('change', e => {
      filters.onlySupport = e.target.checked;
      updateView();
    });

    document.getElementById('reset-btn').addEventListener('click', () => {
      document.getElementById('search-input').value = '';
      document.getElementById('status-filter').value = 'all';
      document.getElementById('only-support').checked = false;
      filters = { search: '', status: 'all', onlySupport: false };
      updateView();
    });

    document.querySelectorAll('.role-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.role-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentRole = tab.dataset.role;
        updateView();
      });
    });

    // ============================================================
    // ЗАГРУЗКА ДАННЫХ
    // ============================================================
    fetch('./data.json')
      .then(res => {
        if (!res.ok) throw new Error('Ошибка загрузки data.json');
        return res.json();
      })
      .then(json => {
        rawData = json.projects || [];
        updateView();
      })
      .catch(err => {
        console.error(err);
        document.body.innerHTML = `<div style="padding:40px; text-align:center; color:#B45309;">
          <h2>Ошибка загрузки данных</h2>
          <p>Убедитесь, что файл <code>data.json</code> лежит рядом с <code>index.html</code> и сервер запущен.</p>
        </div>`;
      });
  </script>
</body>
</html>
